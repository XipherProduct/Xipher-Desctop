name: build-and-sign

# Сборка Windows-релиза Xipher Desktop и подпись.
# Подпись бесплатна через SignPath Foundation (для open-source) — см. docs/SIGNING.md.
# Шаг подписи выполняется только если задана переменная репозитория
# SIGNPATH_ORGANIZATION_ID, иначе просто публикуется неподписанный артефакт.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # MSVC-окружение (cl, link) для генератора Ninja.
      - uses: ilammy/msvc-dev-cmd@v1

      # Qt 6 + модуль WebSockets.
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          modules: 'qtwebsockets qtmultimedia'
          cache: true

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Deploy Qt runtime
        run: windeployqt --release --no-translations --no-system-d3d-compiler build/bin/Xipher.exe

      # Неподписанный артефакт (всегда). Если настроен SignPath — он будет подписан ниже.
      - name: Upload unsigned artifact
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: Xipher-windows
          path: build/bin

      # ── Подпись через SignPath (бесплатно для open-source) ──────────────────
      # Что заполнить (один раз):
      #   1) Зарегистрировать проект на signpath.io (Foundation-программа для OSS).
      #   2) Repo → Settings → Variables: SIGNPATH_ORGANIZATION_ID.
      #   3) Repo → Settings → Secrets: SIGNPATH_API_TOKEN.
      #   4) project-slug / signing-policy-slug / artifact-configuration-slug —
      #      из настроек проекта SignPath.
      - name: Sign with SignPath
        id: signpath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        # Подпись — необязательный шаг: неподписанный артефакт уже загружен,
        # и истёкший токен SignPath не должен ронять выпуск релиза.
        continue-on-error: true
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: 'Xipher_Desktop'
          signing-policy-slug: 'Xipher_test'
          artifact-configuration-slug: 'initial'
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: 'signed'

      - name: Upload signed artifact
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && steps.signpath.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: Xipher-windows-signed
          path: signed

  # ── Linux (x86_64): Qt из дистрибутива, WebRTC из third_party ─────────────
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ \
            qt6-base-dev qt6-multimedia-dev qt6-websockets-dev \
            libopus-dev libssl-dev zlib1g-dev

      - name: Build libdatachannel (WebRTC)
        run: |
          cmake -S third_party/libdatachannel -B third_party/libdatachannel/build-linux \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DNO_WEBSOCKET=ON
          cmake --build third_party/libdatachannel/build-linux \
            --target datachannel-static -j"$(nproc)"

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Package
        run: |
          strip build/bin/Xipher
          VER="${GITHUB_REF_NAME#v}"
          mkdir -p pkg/Xipher-$VER-linux-x86_64
          cp build/bin/Xipher pkg/Xipher-$VER-linux-x86_64/
          cat > pkg/Xipher-$VER-linux-x86_64/README.txt <<EOT
          Xipher Desktop $VER (Linux x86_64)

          Запуск: ./Xipher

          Системные зависимости (есть в актуальных дистрибутивах):
            Qt 6 (Base, Multimedia, WebSockets), libopus, OpenSSL, zlib.

          WebRTC (libdatachannel) и Opus-кодек уже внутри бинарня;
          TURN/STUN-конфигурация запрашивается у сервера при звонке.
          EOT
          tar -C pkg -czf "Xipher-$VER-linux-x86_64.tar.gz" "Xipher-$VER-linux-x86_64"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Xipher-linux-x86_64
          path: Xipher-*.tar.gz

  # ── Релиз: тег → GitHub Release с артефактами обеих платформ ─────────────
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
