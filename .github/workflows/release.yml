name: build-and-sign

# Релизные сборки Xipher Desktop: Windows x64, Linux x86_64, macOS.
# Подпись Windows бесплатна через SignPath Foundation (для open-source) —
# см. docs/SIGNING.md. Шаг подписи выполняется только если задана переменная
# репозитория SIGNPATH_ORGANIZATION_ID, иначе публикуется неподписанный zip.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # MSVC-окружение (cl, link) для генератора Ninja.
      - uses: ilammy/msvc-dev-cmd@v1

      # Qt 6 + модули WebSockets/Multimedia.
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          modules: 'qtwebsockets qtmultimedia'
          cache: true

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Deploy Qt runtime
        run: windeployqt --release --no-translations --no-system-d3d-compiler build/bin/Xipher.exe

      # Готовая к распаковке папка: zip вместо россыпи файлов в релизе.
      - name: Package (zip)
        shell: pwsh
        run: |
          $VER = "${{ github.ref_name }}".TrimStart('v')
          Compress-Archive -Path build/bin/* -DestinationPath "Xipher-$VER-windows-x64.zip"

      - name: Upload artifact
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: Xipher-windows-x64
          path: Xipher-*-windows-x64.zip

      # ── Подпись через SignPath (бесплатно для open-source) ──────────────────
      # Что заполнить (один раз):
      #   1) Зарегистрировать проект на signpath.io (Foundation-программа для OSS).
      #   2) Repo → Settings → Variables: SIGNPATH_ORGANIZATION_ID.
      #   3) Repo → Settings → Secrets: SIGNPATH_API_TOKEN.
      #   4) project-slug / signing-policy-slug / artifact-configuration-slug —
      #      из настроек проекта SignPath.
      - name: Sign with SignPath
        id: signpath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        # Подпись — необязательный шаг: неподписанный zip уже загружен,
        # и истёкший токен SignPath не должен ронять выпуск релиза.
        continue-on-error: true
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: 'Xipher_Desktop'
          signing-policy-slug: 'Xipher_test'
          artifact-configuration-slug: 'initial'
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: 'signed'

  # ── Linux (x86_64): Qt из дистрибутива, WebRTC из third_party ─────────────
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ \
            qt6-base-dev qt6-svg-dev qt6-multimedia-dev qt6-websockets-dev \
            libopus-dev libssl-dev zlib1g-dev

      # third_party/ не в git (там же лежат локальные сборки): WebRTC берём
      # пиненным тегом с сабмодулями (tarball с GitHub идёт без них).
      - name: Fetch libdatachannel v0.24.5 (WebRTC)
        run: |
          mkdir -p third_party
          git clone --depth 1 --branch v0.24.5 \
            --recurse-submodules --shallow-submodules \
            https://github.com/paullouisageneau/libdatachannel.git \
            third_party/libdatachannel

      - name: Build libdatachannel (WebRTC)
        run: |
          cmake -S third_party/libdatachannel -B third_party/libdatachannel/build-linux \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DNO_WEBSOCKET=ON
          cmake --build third_party/libdatachannel/build-linux \
            --target datachannel-static -j"$(nproc)"

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Package
        run: |
          strip build/bin/Xipher
          VER="${GITHUB_REF_NAME#v}"
          mkdir -p pkg/Xipher-$VER-linux-x86_64
          cp build/bin/Xipher pkg/Xipher-$VER-linux-x86_64/
          cat > pkg/Xipher-$VER-linux-x86_64/README.txt <<EOT
          Xipher Desktop $VER (Linux x86_64)

          Запуск: ./Xipher
          Системные зависимости: Qt 6 (Base, Svg, Multimedia, WebSockets),
          libopus, OpenSSL, zlib.
          WebRTC (libdatachannel) и Opus-кодек уже внутри бинарника;
          TURN/STUN-конфигурация запрашивается у сервера при звонке.

          Вариант «скачал и запустил» — AppImage со страницы релиза.
          EOT
          tar -C pkg -czf "Xipher-$VER-linux-x86_64.tar.gz" "Xipher-$VER-linux-x86_64"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Xipher-linux-x86_64
          path: Xipher-*.tar.gz

  # ── macOS (arm64, Apple Silicon) ──────────────────────────────────────────
  # Бинарник не подписан разработчиком Apple: при первом запуске macOS может
  # спросить подтверждение (правый клик → «Открыть», либо xattr -cr Xipher.app).
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: brew install ninja

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          host: mac
          target: desktop
          modules: 'qtwebsockets qtmultimedia'
          cache: true

      - name: Fetch libdatachannel v0.24.5 (WebRTC)
        run: |
          mkdir -p third_party
          git clone --depth 1 --branch v0.24.5 \
            --recurse-submodules --shallow-submodules \
            https://github.com/paullouisageneau/libdatachannel.git \
            third_party/libdatachannel

      - name: Build libdatachannel (WebRTC)
        run: |
          cmake -S third_party/libdatachannel -B third_party/libdatachannel/build-mac \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DNO_WEBSOCKET=ON
          cmake --build third_party/libdatachannel/build-mac \
            --target datachannel-static -j"$(sysctl -n hw.ncpu)"

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      # Голый бинарник (MACOSX_BUNDLE не задан) оборачиваем в .app вручную:
      # macdeployqt затянет Qt-библиотеки и плагины внутрь бандла.
      - name: Package (.app → zip)
        run: |
          VER="${GITHUB_REF_NAME#v}"
          APP="Xipher.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp build/bin/Xipher "$APP/Contents/MacOS/Xipher"
          cat > "$APP/Contents/Info.plist" <<EOT
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>Xipher</string>
            <key>CFBundleIdentifier</key><string>pro.xipher.desktop</string>
            <key>CFBundleName</key><string>Xipher</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$VER</string>
            <key>CFBundleVersion</key><string>$VER</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOT
          ICON_SRC="$(find resources -name 'xipher.icns' -o -name 'xipher.png' | head -1)"
          if [ -n "$ICON_SRC" ]; then
            cp "$ICON_SRC" "$APP/Contents/Resources/xipher.$(basename "$ICON_SRC" | sed 's/.*\.//')"
          fi
          macdeployqt "$APP" -verbose=1
          # Ad-hoc подпись: без неё Gatekeeper ругается сильнее, с ней локально
          # достаточно «правый клик → Открыть».
          codesign --force --deep -s - "$APP" || true
          zip -qry "Xipher-$VER-macos-arm64.zip" "$APP"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Xipher-macos-arm64
          path: Xipher-*-macos-arm64.zip

  # ── Релиз: тег → GitHub Release с артефактами всех платформ ───────────────
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            **Xipher Desktop ${{ github.ref_name }}**

            | Платформа | Файл | Установка |
            |---|---|---|
            | Windows x64 | `Xipher-*-windows-x64.zip` | распаковать → `Xipher.exe` |
            | Linux x86_64 | `Xipher-*-linux-x86_64.tar.gz` | распаковать → `./Xipher` (нужен Qt6 в системе) |
            | Linux x86_64 | `Xipher-*-x86_64.AppImage` | `chmod +x` → запустить (всё внутри) |
            | macOS arm64 (M1/M2/M3) | `Xipher-*-macos-arm64.zip` | распаковать → `Xipher.app`; сборка без подписи Apple: правый клик → «Открыть» |

            Windows: при отсутствии системных библиотек MSVC установите
            [vc_redist.x64](https://aka.ms/vs/17/release/vc_redist.x64.exe).
          files: dist/*
